# プッシュと PR のたびにテストを流す（計算・Firestore のルール・Cloud Functions）
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4   # Firebase のエミュレーターに要る
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm install -g firebase-tools@13.29.1
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:functions
